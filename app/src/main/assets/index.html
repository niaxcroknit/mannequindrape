<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>마네킹 드레이프 3D</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="마네킹 드레이프">
<style>
/* Layout: 줄자 작업대 — 모바일은 그림이 위에 붙어 있고 아래에서 입력, 데스크톱은 입력 | 그림(고정) | 결과 */
:root{
  --bg:#ECEEE9; --panel:#F8F9F6; --ink:#1E2A2D; --muted:#5D6966; --line:#CBD2CB;
  --tape:#B8820C; --tape-soft:#F3E4B8; --stage:#E6E9E4; --sole:#2A2A2A;
  --ok:#2F7D55; --warn:#B4650E; --bad:#B03A2E;
  --c-top:#2F6FE0; --c-outer:#D98A00; --c-bot:#E0436A; --c-alt:#8E44E0; --c-ref:#0E9F6E;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141919; --panel:#1C2324; --ink:#E6ECE8; --muted:#9AA6A3; --line:#2E3939;
  --tape:#E8B931; --tape-soft:#3A3219; --stage:#39403F; --sole:#111;
  --ok:#5DBB8A; --warn:#E39B45; --bad:#E57366;
  --c-top:#5B9BFF; --c-outer:#FFB020; --c-bot:#FF6B8E; --c-alt:#C08BFF; --c-ref:#34D399; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141919; --panel:#1C2324; --ink:#E6ECE8; --muted:#9AA6A3; --line:#2E3939;
  --tape:#E8B931; --tape-soft:#3A3219; --stage:#39403F; --sole:#111;
  --ok:#5DBB8A; --warn:#E39B45; --bad:#E57366;
  --c-top:#5B9BFF; --c-outer:#FFB020; --c-bot:#FF6B8E; --c-alt:#C08BFF; --c-ref:#34D399; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch;font-size:13px}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "ctrl" "result";align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}

/* 그림 */
.stage{grid-area:stage;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:46vh;height:46svh;min-height:300px;display:flex;flex-direction:column;background:var(--stage);overflow:hidden;box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
.stage.big{height:74vh;height:74svh}
.stagebar{display:flex;align-items:center;gap:6px 10px;padding:8px 10px 0;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);flex:1;min-width:0}
.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend i{display:inline-block;width:14px;height:0;border-top:3px solid currentColor}
.legend i.d{border-top-style:dashed}
.sizebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font:500 12px var(--f-body);cursor:pointer}
#fig{flex:1;min-height:0;padding:4px 6px 6px}
#fig svg{width:100%;height:100%;display:block}
@media (min-width:860px){
  .grid{grid-template-columns:340px minmax(0,1fr);grid-template-areas:"ctrl stage" "result stage"}
  .stage,.stage.big,.stage.typing{top:16px;height:calc(100vh - 32px);min-height:560px;max-height:1100px}
  .sizebtn{display:none}
}
@media (min-width:1240px){.grid{grid-template-columns:340px minmax(0,1fr) 320px;grid-template-areas:"ctrl stage result"}}

/* SVG 요소 */
#fig .bodyimg{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #fig .bodyimg{filter:drop-shadow(0 0 .5px rgba(255,255,255,.55))}}
:root[data-theme="dark"] #fig .bodyimg{filter:drop-shadow(0 0 .5px rgba(255,255,255,.55))}
#fig .g{fill-opacity:.2;stroke-width:.35;stroke-dasharray:1.2 .7}
#fig .hemln{stroke-width:.95;stroke-linecap:round}
#fig .hemln.w{stroke-dasharray:1.6 .9;stroke-width:.7}
#fig .hemln.alt{stroke-dasharray:1.4 .8;stroke-width:.85}
#fig .hemln.ref{stroke-dasharray:.5 .9;stroke-width:1.05}
#fig .sole{fill:var(--sole)}
#fig .tape{fill:var(--tape-soft);stroke:var(--tape);stroke-width:.2}
#fig .tick{stroke:var(--tape);stroke-width:.12}
#fig .tick.b{stroke-width:.28}
#fig .num{font-family:var(--f-mono);fill:var(--muted)}
#fig .lmk{stroke:var(--muted);stroke-opacity:.45;stroke-width:.15;stroke-dasharray:.6 .6}
#fig .lmk-t{font-family:var(--f-body);fill:var(--muted)}
#fig .lead{stroke:var(--ink);stroke-opacity:.7;fill:none;stroke-width:.18}
#fig .dot{fill:var(--ink)}
#fig .nt{font-family:var(--f-body);font-weight:600;fill:var(--ink)}
#fig .ns{font-family:var(--f-body);fill:var(--muted)}
#fig .guide{stroke:var(--tape);stroke-width:.2;stroke-dasharray:1 .7}
#fig .gm{fill:var(--tape)}
#fig .gn{font-family:var(--f-mono);font-weight:500;fill:var(--tape)}
#fig .floorline{stroke:var(--muted);stroke-opacity:.5;stroke-width:.2}
#fig .heelt{font-family:var(--f-body);fill:var(--muted)}

/* 입력 */
.ctrl{grid-area:ctrl;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;padding:11px 10px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.tabs button .dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.pane{padding:14px 16px 18px;display:flex;flex-direction:column;gap:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:focus-visible,.tabs button:focus-visible,.step:focus-visible,.sizebtn:focus-visible,.linkbtn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px}
.field .name{font-weight:500}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}
.num input{width:60px;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-mono);text-align:right;padding:6px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .u{font:12px var(--f-mono);color:var(--muted);padding:0 6px 0 3px}
.step{border:0;background:transparent;color:var(--muted);width:32px;height:36px;font:500 17px var(--f-mono);cursor:pointer}
.step:hover{background:var(--line);color:var(--ink)}
.txt{border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:500 15px var(--f-body);padding:6px 8px;width:100%;min-width:0}
.note{font-size:12px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--tape);font:600 12px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
details{border-top:1px solid var(--line);padding-top:10px}
details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style-position:inside}
details[open]>summary{margin-bottom:10px}
details .inner{display:flex;flex-direction:column;gap:13px}
.altbox{border:1px dashed var(--c-alt);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:11px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--c-alt)}
.refcard{border:1px solid var(--line);border-left:3px solid var(--c-ref);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.refhead{display:flex;gap:8px;align-items:center}
.refhead .linkbtn{white-space:nowrap}
.ctrl input{scroll-margin-top:calc(46vh + 24px)}
.stage.typing{height:30vh;height:30svh;min-height:220px}
.stage.typing~.ctrl input{scroll-margin-top:calc(30vh + 24px)}
.addbtn{border:1px dashed var(--c-ref);background:transparent;color:var(--ink);border-radius:8px;padding:9px;font:600 13px var(--f-body);cursor:pointer}

/* 결과 */
.result{grid-area:result;padding:14px 16px 16px;display:flex;flex-direction:column;gap:16px}
.result h2{font-family:var(--f-display);font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:7px}
.result h2 i{display:inline-block;width:10px;height:10px;border-radius:50%}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--line)}
.row .k{color:var(--muted);font-size:12.5px;padding-top:1px}
.row .v{font-weight:500;min-width:0}
.row .s{grid-column:2;font-size:12px;color:var(--muted)}
.row.alt .k{color:var(--c-alt)}
.row.ref .k{color:var(--c-ref)}
.pill{display:inline-block;font:600 11px var(--f-body);padding:1px 7px;border-radius:999px;margin-left:6px;border:1px solid currentColor;vertical-align:1px}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (max-width:420px){.row{grid-template-columns:66px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>마네킹 드레이프 3D</h1>
    <p>내 치수에 맞춘 마네킹 위에 옷 실측을 겹쳐서, 밑단과 소매 끝이 몸의 어디에 오는지 보여줍니다. 숫자는 쇼핑몰 실측표 그대로 넣으면 됩니다.</p>
  </header>

  <div class="grid">
    <section class="panel stage" id="stage" aria-label="착용 그림">
      <div class="stagebar">
        <div class="legend" id="legend"></div>
        <button class="sizebtn" type="button" id="sizebtn">그림 크게</button>
      </div>
      <div id="fig"></div>
    </section>

    <section class="panel ctrl" aria-label="치수 입력">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="pane"></div>
    </section>

    <section class="panel result" id="report" aria-label="착용 결과"></section>
  </div>
</div>

(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, R=n=>Math.round(n);
const sg=n=>{n=R(n);return (n>=0?'+':'−')+Math.abs(n)};
const num=(v,d)=>{v=parseFloat(v);return isFinite(v)?v:d};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLV={top:'--c-top',outer:'--c-outer',bot:'--c-bot',alt:'--c-alt',ref:'--c-ref'};

/* ---------- 기본값 ---------- */
const DEF_BODY={h:160,hps:131,hpsAuto:true,crotch:73,crotchAuto:true,arm:52,heel:0,sh:38,ch:84,wa:68,hi:92};
const TOP_KIND={long:{len:66,sh:39,ch:51,sl:58},short:{len:62,sh:42,ch:52,sl:19}};
const OUTER_DEF={len:100,sh:42,ch:57,sl:60};
const BOT_KIND={pants:{len:94,wa:35,rise:27,th:29,hem:18},skirt:{len:66,wa:34,hem:50}};
const SKIRT_AT={waist:{label:'허리선',off:-1},high:{label:'하이웨이스트',off:4},hip:{label:'골반',off:-7}};
function defState(){return {v:5,tab:'body',big:false,body:{...DEF_BODY},
  top:{on:true,kind:'long',...TOP_KIND.long,alt:{on:false,len:72,sl:60}},
  outer:{on:false,...OUTER_DEF,alt:{on:false,len:110,sl:60}},
  bot:{on:true,kind:'pants',...BOT_KIND.pants,at:'waist',alt:{on:false,len:102}},
  refs:[]}}

/* ---------- 저장 · 이전 버전 값 이어받기 ---------- */
function merge(d,s){for(const k in s){const v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&d[k]&&typeof d[k]==='object')d[k]=merge(d[k],v);else if(v!==undefined)d[k]=v}return d}
function migrate(o){const s=defState(),b=o.body||{},B=s.body;
  ['h','sh','ch','wa','hi','arm'].forEach(k=>B[k]=num(b[k],B[k]));
  if(isFinite(b.ins)){B.crotch=+b.ins;B.crotchAuto=false}else B.crotch=Math.round(B.h*0.456*2)/2;
  if(isFinite(b.head)&&isFinite(b.neck)){B.hps=Math.round((B.h-b.head-b.neck)*2)/2;B.hpsAuto=false}else B.hps=Math.round(B.h*0.82*2)/2;
  const t=o.top||{},p=o.bot||{},pick=(src,keys)=>{const r={};keys.forEach(k=>{if(isFinite(src[k]))r[k]=+src[k]});return r};
  if(t.type==='coat'){Object.assign(s.outer,{on:true},pick(t,['len','sh','ch','sl']))}
  else if(t.type==='none'){s.top.on=false}
  else if(t.type){Object.assign(s.top,{on:true,kind:num(t.sl,30)>35?'long':'short'},pick(t,['len','sh','ch','sl']))}
  if(p.type==='skirt')Object.assign(s.bot,{on:true,kind:'skirt'},pick(p,['len','wa','hem']));
  else if(p.type==='none')s.bot.on=false;
  else if(p.type)Object.assign(s.bot,{on:true,kind:'pants'},pick(p,['len','wa','rise','th','hem']));
  return s}
function load(){
  try{const s=JSON.parse(localStorage.getItem('fitroom-v5'));if(s&&s.v===5){const m=merge(defState(),s);delete m.top.label;delete m.bot.label;return m}}catch(e){}
  for(const k of ['fitroom-v4','fitroom-v3','fitroom-v2','fitroom-v1']){try{const o=JSON.parse(localStorage.getItem(k));if(o&&o.body)return migrate(o)}catch(e){}}
  return defState()}
let state=load();
const save=()=>{try{localStorage.setItem('fitroom-v5',JSON.stringify(state))}catch(e){}};

      else{const w=x2-x1+1,dw=(d2-d1)*PX;if(dw<=0)return;g.drawImage(img,x1,r,w,1,X(d1),j,dw,1);g.drawImage(img,2*c0-x2,r,w,1,X(-d2),j,dw,1)}})}
  for(let j=0;j<cv.height;j++){const y=H+1-(j+0.5)/PX;if(y<0||y>yS)continue;const r=armRow(y);if(r<=185||r>IMG_LM.tip+6)continue;const X=x=>(x-X0)*PX;
    rowMap(r).forEach(([x1,x2,d1,d2,k])=>{if(k!=='arm')return;const w=x2-x1+1,dw=(d2-d1)*PX;if(dw<=0)return;g.drawImage(img,x1,r,w,1,X(d1),j,dw,1);g.drawImage(img,2*c0-x2,r,w,1,X(-d2),j,dw,1)})}
  const shPts=[];for(let r=IMG_LM.chin;r<=AP;r++){const m=rowMap(r);if(m.length)shPts.push([-m[0][2],yOf(r)])}
  const L={};for(const k in IMG_LM)L[k]=yOf(IMG_LM[k]);
  L.wrist=yS-(yS-L.wrist)*kArm;L.tip=yS-(yS-L.tip)*kArm;
  const half=y=>{const o=geo(y);if(!o)return 0;return o.torso!==undefined?o.torso:o.leg?o.leg[1]:0};
  const legIn=y=>{const o=geo(y);return o&&o.leg?o.leg[0]:0};
  let rr=0,n=0;for(let y=L.armpit-3;y>L.armpit-12;y-=1){const o=geo(y);if(o&&o.arm){rr+=(o.arm[1]-o.arm[0])/2;n++}}rr=(rr/(n||1))*1.05;
  const armAt=y=>{if(y>=L.armpit-1){const out=half(y);return [out-2*rr,out]}const o=geo(y);if(o&&o.arm)return o.arm;const p=geo(L.tip+0.5);return p&&p.arm?p.arm:[0,0]};
  const armY=s=>L.acr-s*(L.acr-L.wrist)/b.arm;
  const edge=(s,side,extra=0)=>{const a=armAt(armY(s)),y=armY(s);return side>0?[a[1]+extra,y]:[a[0]-extra,y]};
  const shLine=x=>{for(const p of shPts)if(p[0]>=x)return p[1];return shPts[shPts.length-1][1]};
  const armPoly=(yCut,side)=>{const o=[],i=[];for(let y=yCut;y>=L.tip-0.5;y-=0.4){const a=armAt(y);o.push([side*(a[1]+0.15),y]);i.push([side*(a[0]-0.15),y])}return o.concat(i.reverse())};
  let maxHalf=0;for(let y=2;y<H;y+=2){const o=geo(y);if(o){maxHalf=Math.max(maxHalf,o.torso||0,o.leg?o.leg[1]:0,o.arm?o.arm[1]:0)}}
  return {url:cv.toDataURL('image/png'),X0,Wc,H,half,legIn,armAt,edge,armY,shLine,armPoly,L,rN:half(yOf(140)),outerShoulder:half(yOf(208)),maxHalf,footX:(half(3)+legIn(3))/2}
}

/* ---------- 몸 기준점 ---------- */
function model(b){const A=anchorsFor(b),{yOf}=mkMap(A.P),M={H:A.H,crotch:A.c,hps:A.hps,chin:A.chin};
  ['acr','armpit','chest','underbust','waist','navel','pelvis','hip','calf'].forEach(k=>M[k]=yOf(IMG_LM[k]));
  M.fold=M.crotch+0.5;M.knee=0.58*M.crotch;M.ankle=0.092*M.crotch;M.navel=M.waist-0.025*M.H;
  M.L=b.arm;M.E=0.57*b.arm;M.hand=0.108*M.H;
  M.LM=[['복숭아뼈',M.ankle],['종아리',M.calf],['무릎',M.knee],['허벅지 중간',(M.crotch+M.knee)/2],['엉덩이 아래선',M.fold],['엉덩이 가장 넓은 곳',M.hip],['골반뼈',M.pelvis],['배꼽',M.navel],['허리선',M.waist],['가슴 아래',M.underbust],['가슴',M.chest]];
  M.ARM=[['어깨 끝',0],['위팔 중간',M.E/2],['팔꿈치',M.E],['아래팔 중간',(M.E+M.L)/2],['손목뼈',M.L],['손등 중간',M.L+M.hand*0.45],['손가락 끝',M.L+M.hand]];
  const ck=[[M.crotch-2,b.hi*0.86],[M.fold,b.hi*0.95],[M.hip,b.hi],[M.pelvis,(b.hi+b.wa)/2+1],[M.navel,b.wa*1.02],[M.waist,b.wa],[M.underbust,(b.wa+b.ch)/2+2],[M.chest,b.ch]];
  M.circ=y=>{if(y<=ck[0][0])return ck[0][1];for(let i=0;i<ck.length-1;i++)if(y<=ck[i+1][0])return lerp(ck[i][1],ck[i+1][1],(y-ck[i][0])/(ck[i+1][0]-ck[i][0]));return ck[ck.length-1][1]};
  M.thigh=b.hi*0.58;
  return M}
function near(list,v){let best=list[0];list.forEach(l=>{if(Math.abs(v-l[1])<Math.abs(v-best[1]))best=l});const d=v-best[1];
  return Math.abs(d)<1?`${best[0]}에 딱`:`${best[0]} ${R(Math.abs(d))}cm ${d>0?'위':'아래'}`}
function nearArm(list,s){let best=list[0];list.forEach(l=>{if(Math.abs(s-l[1])<Math.abs(s-best[1]))best=l});const d=s-best[1];
  return Math.abs(d)<1?`${best[0]}에 딱`:`${best[0]} ${R(Math.abs(d))}cm ${d>0?'아래':'위'}`}

/* ---------- 착용 계산 ---------- */
function compute(){
  const b=state.body,M=model(b),heel=clamp(num(b.heel,0),0,15),C={M,heel};
  const hemTop=y=>{const gr=y+heel;if(gr<0)return `바닥에 ${R(-gr)}cm 끌림`;if(y<0)return '발을 덮음';return near(M.LM,y)};
  const hemPants=y=>{const gr=y+heel;
    if(gr<0)return `바닥에 ${R(-gr)}cm 끌림`;
    if(y<0)return heel>0?`굽을 ${R(-y)}cm 덮음 · 브레이크`:'발등을 덮음 · 브레이크';
    if(y<M.ankle-1.5)return '발등을 덮음 · 브레이크';
    if(Math.abs(y-M.ankle)<=1.5)return '복숭아뼈에 딱 · 노브레이크';
    if(y-M.ankle<12)return `복숭아뼈 ${R(y-M.ankle)}cm 위 · 앵클`;
    return near(M.LM,y)};
  const ground=y=>R(y+heel);
  const gtxt=y=>R(y+heel)<=0?'밑단이 바닥에 닿아요':`바닥에서 <span class="mono">${R(y+heel)}</span>cm`;C.gtxt=gtxt;
  const cover=y=>y>M.pelvis?'엉덩이를 덮지 않음':y<M.fold?'엉덩이를 다 덮음':`엉덩이 약 ${R(clamp((M.pelvis-y)/(M.pelvis-M.fold),0,1)*100)}% 덮음`;
  const sEase=(g,base)=>clamp(base+(2*g.ch-b.ch)*0.05,base,base+2.6);
  function topCalc(g,outer){const T={g,outer};
    T.hemY=M.hps-g.len;T.hemD=Math.max(T.hemY,-heel+0.4);
    T.sEnd=g.sl+(g.sh-b.sh)/2;T.sEase=sEase(g,outer?1.1:0.6);
    T.hemTxt=hemTop(T.hemY);T.slTxt=nearArm(M.ARM,T.sEnd);T.ground=ground(T.hemY);
    T.chEase=2*g.ch-b.ch;T.shDiff=g.sh-b.sh;
    if(g.alt&&g.alt.on){const a=g.alt;T.alt={hemY:M.hps-a.len,sEnd:a.sl+(g.sh-b.sh)/2,len:a.len,sl:a.sl};
      T.alt.hemD=Math.max(T.alt.hemY,-heel+0.4);T.alt.hemTxt=hemTop(T.alt.hemY);T.alt.slTxt=nearArm(M.ARM,T.alt.sEnd);T.alt.ground=ground(T.alt.hemY)}
    return T}
  if(state.top.on)C.T=topCalc(state.top,false);
  if(state.outer.on){C.O=topCalc(state.outer,true);if(C.T)C.O.sEase=Math.max(C.O.sEase,C.T.sEase+0.9)}
  if(state.bot.on){const p=state.bot,P={g:p,kind:p.kind};
    P.yW=p.kind==='skirt'?M.waist+(SKIRT_AT[p.at]||SKIRT_AT.waist).off:M.crotch+p.rise-2.5;
    P.hemY=P.yW-p.len;P.hemD=Math.max(P.hemY,-heel+0.4);
    P.hemTxt=p.kind==='skirt'?hemTop(P.hemY):hemPants(P.hemY);P.waistTxt=near(M.LM,P.yW);P.ground=ground(P.hemY);
    P.wEase=2*p.wa-M.circ(P.yW);if(p.kind==='pants')P.thEase=2*p.th-M.thigh;
    if(p.alt&&p.alt.on){const yA=P.yW-p.alt.len;P.alt={hemY:yA,hemD:Math.max(yA,-heel+0.4),len:p.alt.len,hemTxt:p.kind==='skirt'?hemTop(yA):hemPants(yA),ground:ground(yA)}}
    C.P=P}
  C.refs=state.refs.map(r=>{const yW=r.cat==='pants'?M.crotch+num(r.rise,27)-2.5:r.cat==='skirt'?M.waist+(SKIRT_AT[r.at]||SKIRT_AT.waist).off:M.hps;
    const y=yW-num(r.len,0);return {...r,y,hemTxt:r.cat==='pants'?hemPants(y):hemTop(y)}});
  return C}

/* ---------- 그림 ---------- */
const tw=(str,fs)=>{let w=0;for(const ch of String(str))w+=/[ㄱ-힣]/.test(ch)?fs*1.0:/[A-Za-z0-9.+\-−%·()]/.test(ch)?fs*0.58:fs*0.4;return w};
function drawIllo(st,C,IB,s,onlyK){
  const b=st.body,M=C.M,H=M.H,S=b.sh,heel=C.heel;
  const TOP=H+heel+5,X=x=>+x.toFixed(2),Yv=y=>+(TOP-(y+heel)).toFixed(2),Yg=y=>+(TOP-y).toFixed(2);
  const mirror=pts=>pts.slice().reverse().map(p=>[-p[0],p[1],p[2]]);
  function path(pts,closed=true){const n=pts.length,P=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
    let d=`M${X(pts[0][0])} ${Yv(pts[0][1])}`;
    for(let i=0;i<(closed?n:n-1);i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2),a=p1[2]?0:1/6,bq=p2[2]?0:1/6;
      d+=` C${X(p1[0]+(p2[0]-p0[0])*a)} ${Yv(p1[1]+(p2[1]-p0[1])*a)} ${X(p2[0]-(p3[0]-p1[0])*bq)} ${Yv(p2[1]-(p3[1]-p1[1])*bq)} ${X(p2[0])} ${Yv(p2[1])}`}
    return d+(closed?'Z':'')}
  const half=y=>IB.half(Math.max(y,0.4)),legIn=y=>IB.legIn(Math.max(y,0.4));
  const c=M.crotch,K=M.knee,A=M.ankle,mid=K+0.5*(c-K),cal=K-0.3*(K-A),low=K-0.62*(K-A);
  const cx=y=>(half(y)+legIn(y))/2,rO=y=>Math.max(0.5,(half(y)-legIn(y))/2);
  const hipHalf=half(M.hip),rN=IB.rN,edge=IB.edge,shLine=IB.shLine;
  const KX=clamp((half(M.chest)/(b.ch/(Math.PI*1.72))+half(M.waist)/(b.wa/(Math.PI*1.78))+hipHalf/(0.97*b.hi/(Math.PI*1.64)))/3,0.6,1.1);
  const col=k=>css(COLV[k]);
  const marks=[];let wMax=IB.maxHalf+1;
  const G={bot:'',top:'',outer:'',topS:'',outerS:''};
  const gpath=(d,k)=>`<path d="${d}" class="g" fill="${col(k)}" stroke="${col(k)}"/>`;

  /* 하의 */
  let botHalfAt=()=>0;const P=C.P;
  if(P){const g=P.g,yW=P.yW,wHalf=half(yW)+0.6,hem=P.hemD;
    if(P.kind==='skirt'){
      const hh=Math.max(hipHalf+1.2,2*g.hem/(Math.PI*1.8)*KX,hem<c?half(hem)+1.5:0);
      const r=[[0,yW,1],[wHalf,yW,1]];if(M.hip<yW-3)r.push([hipHalf+1.1,M.hip]);
      r.push([hh,hem+1,1],[hh*0.5,hem-0.2],[0,hem-0.4]);
      const hAt=y=>y>M.hip?half(y)+0.7:lerp(hh,hipHalf+1.1,clamp((y-hem)/(M.hip-hem),0,1));
      botHalfAt=y=>y>yW||y<hem?0:hAt(y);
      G.bot=gpath(path(r.concat(mirror(r)).slice(0,-1)),'bot');wMax=Math.max(wMax,hh);
      marks.push({k:'bot',y:hem,xR:hh,name:'스커트 밑단',desc:P.hemTxt,guide:true});
      if(P.alt)marks.push({k:'alt',y:P.alt.hemD,xR:Math.max(hAt(P.alt.hemD),half(P.alt.hemD)+1.5),name:'B안 스커트 밑단',desc:P.alt.hemTxt,cls:'alt',guide:true,src:'bot'});
    }else{
      const thighH=g.th/Math.PI*KX,hemH=g.hem/Math.PI*KX*(P.hemY<0?1.12:1);
      const gw=y=>Math.max(rO(y)+0.7,lerp(hemH,thighH,clamp((y-P.hemY)/((c-3)-P.hemY),0,1)));
      const r=[[0,yW,1],[wHalf,yW,1]];
      if(M.pelvis<yW-2)r.push([half(M.pelvis)+0.8,M.pelvis]);
      if(M.hip<yW-2)r.push([hipHalf+0.9,M.hip]);
      const lys=[c-3,mid,K+6,K,cal,low,A+5].filter(y=>y>hem+2);
      lys.forEach(y=>r.push([cx(y)+gw(y),y]));
      r.push([cx(hem)+gw(hem),hem,1],[Math.max(cx(hem)-gw(hem),0.05),hem,1]);
      lys.slice().reverse().forEach(y=>r.push([Math.max(cx(y)-gw(y)*0.95,0.05),y]));
      r.push([0.5,c-0.5],[0,c+0.3,1]);
      botHalfAt=y=>y>yW||y<hem?0:(y>c?Math.max(half(y)+0.8,y<M.hip+1?hipHalf+0.9:0):cx(y)+gw(y));
      G.bot=gpath(path(r.concat(mirror(r)).slice(0,-1)),'bot');wMax=Math.max(wMax,cx(c-3)+gw(c-3));
      marks.push({k:'bot',y:hem,xR:cx(hem)+gw(hem),name:'바지 밑단',desc:P.hemTxt,guide:true});
      if(P.alt){const y=P.alt.hemD;marks.push({k:'alt',y,xR:cx(y)+gw(y),name:'B안 바지 밑단',desc:P.alt.hemTxt,cls:'alt',guide:true,src:'bot'})}
    }
    marks.push({k:'bot',y:yW,xR:wHalf,name:'허리 윗단',desc:P.waistTxt,cls:'w'});
  }

  /* 상의 · 아우터 */
  function topShape(T,env){const g=T.g,outer=T.outer,th=outer?1.3:0.9;
    const Gc=Math.max(env(M.chest)+th,2*g.ch/(Math.PI*1.72)*KX);
    const Gh=y=>{let v=Math.max(env(y)+th,Gc*(y<M.waist?0.985:1));if(outer&&y<M.hip)v+=(M.hip-y)*0.05;return v};
    const drop=(g.sh-S)/2,NP=[rN+(outer?2.4:1.7),M.hps+(outer?1.2:0.7)],lift=outer?1.4:0.8;
    const SP=drop<=0?[Math.max(g.sh/2,NP[0]+3),shLine(g.sh/2)+lift]:edge(drop,1,lift);
    const UA=[Gc+0.1,M.armpit-1.5-Math.max(0,drop)*0.6],hem=T.hemD,r=[];
    if(outer)r.push([0,M.chest-4,1],[rN*1.25,M.hps-2]);else r.push([0,M.hps-5.5],[rN*0.85,M.hps-4.3],[rN+1.4,M.hps-0.8]);
    r.push([NP[0],NP[1],1]);
    if(drop>0){for(let x=NP[0]+1.5;x<IB.outerShoulder-2.5;x+=2)r.push([x,shLine(x)+lift]);for(let q=0;q<drop;q+=2){const e0=edge(q,1,lift);r.push([e0[0],e0[1]])}}
    else{const xm=(NP[0]+SP[0])/2;r.push([xm,shLine(xm)+lift])}
    r.push([SP[0],SP[1],1],[UA[0],UA[1],1]);
    [M.chest,M.underbust,M.waist,M.pelvis,M.hip,c-2,mid,K+6,K,cal,low,A+4].filter(y=>y<UA[1]-2&&y>hem+2).forEach(y=>r.push([Gh(y),y]));
    r.push([Gh(hem),hem,1],[0,hem,1]);
    const bodyD=path(r.concat(mirror(r).slice(1)));
    const sE=T.sEnd,s0=Math.max(drop,0),e=T.sEase*KX;
    const sAp=(M.acr-M.armpit)/(M.acr-IB.L.wrist)*M.L;
    const eS=sv=>e*lerp(1,sE>30?0.55:0.9,clamp((sv-s0)/Math.max(sE-s0,1),0,1));
    const sl=side=>{const ss=[];for(let sv=s0+3;sv<sE;sv+=4)ss.push(sv);ss.push(sE);
      const out=ss.map(sv=>edge(sv,1,eS(sv))),inT=ss.slice().reverse().filter(sv=>sv>=sAp).map(sv=>edge(sv,-1,eS(sv)));
      if(!inT.length||ss[ss.length-1]<sAp)inT.unshift(edge(sE,-1,eS(sE)));
      const tp=edge(Math.max(sAp,s0+2),-1,eS(sAp)),md=[(SP[0]+tp[0])/2-2.2,(SP[1]+tp[1])/2+0.5];
      out[out.length-1]=[...out[out.length-1],1];inT[0]=[...inT[0],1];
      return path([[SP[0],SP[1],1]].concat(out,inT,[[tp[0],tp[1]],md]).map(p=>[p[0]*side,p[1],p[2]]))};
    const sleeves=sE>s0+1?[sl(-1),sl(1)]:[];
    [M.chest,M.waist,M.hip,hem+1].forEach(y=>{if(y>=hem)wMax=Math.max(wMax,Gh(y))});
    if(sleeves.length)wMax=Math.max(wMax,edge(sE,1,eS(sE))[0]);
    return {bodyD,sleeves,Gh,hem,sE,s0,eS,UA,top:M.armpit}}
  const envBase=y=>Math.max(half(y),botHalfAt(y));
  const shapes={};
  if(C.T){const sh=topShape(C.T,envBase);shapes.top=sh;G.top=gpath(sh.bodyD,'top');G.topS=sh.sleeves.map(d=>gpath(d,'top')).join('')}
  if(C.O){const it=shapes.top,env=it?(y=>Math.max(envBase(y),y>=it.hem&&y<=it.UA[1]?it.Gh(y):0)):envBase;
    const sh=topShape(C.O,env);shapes.outer=sh;G.outer=gpath(sh.bodyD,'outer');G.outerS=sh.sleeves.map(d=>gpath(d,'outer')).join('')}
  [['top','상의'],['outer','아우터']].forEach(([k,nm])=>{const T=k==='top'?C.T:C.O,sh=shapes[k];if(!T)return;
    marks.push({k,y:sh.hem,xR:sh.Gh(sh.hem),name:nm+' 밑단',desc:T.hemTxt,guide:true});
    if(sh.sleeves.length){const o=edge(sh.sE,1,sh.eS(sh.sE)),i=edge(sh.sE,-1,sh.eS(sh.sE));marks.push({k,y:o[1],cuff:[i,o],name:nm+' 소매 끝',desc:T.slTxt})}
    if(T.alt){marks.push({k:'alt',y:T.alt.hemD,xR:sh.Gh(T.alt.hemD),name:'B안 '+nm+' 밑단',desc:T.alt.hemTxt,cls:'alt',guide:true,src:k});
      if(Math.abs(T.alt.sEnd-T.sEnd)>0.4&&T.alt.sEnd>0){const ex=sh.eS(Math.min(T.alt.sEnd,sh.sE)),o=edge(T.alt.sEnd,1,ex),i=edge(T.alt.sEnd,-1,ex);marks.push({k:'alt',y:o[1],cuff:[i,o],name:'B안 '+nm+' 소매',desc:T.alt.slTxt,cls:'alt',src:k})}}
  });
  C.refs.forEach(r=>{const y=Math.max(r.y,-heel+0.4);marks.push({k:'ref',y,xR:Math.max(half(y),botHalfAt(y),shapes.outer&&y>=shapes.outer.hem?shapes.outer.Gh(y):0,shapes.top&&y>=shapes.top.hem?shapes.top.Gh(y):0)+2,name:'내 '+(r.name||'옷'),desc:r.hemTxt,cls:'ref'})});

  /* 밑단 선 */
  let lines='';
  marks.forEach(m=>{const cl=`hemln ${m.cls||''}`,stc=col(m.k);
    if(m.cuff)[-1,1].forEach(sd=>{lines+=`<line x1="${X(sd*m.cuff[0][0])}" y1="${Yv(m.cuff[0][1])}" x2="${X(sd*m.cuff[1][0])}" y2="${Yv(m.cuff[1][1])}" class="${cl}" stroke="${stc}"/>`});
    else lines+=`<line x1="${X(-m.xR)}" y1="${Yv(m.y)}" x2="${X(m.xR)}" y2="${Yv(m.y)}" class="${cl}" stroke="${stc}"/>`});

  /* 줄자 (바닥 기준) */
  const fsN=2.3*s,fsT=2.8*s,fsS=2.45*s,fsL=2.2*s;
  const lmk=[['무릎',K],['가랑이',c],['허리선',M.waist],['목옆점',M.hps]];
  const lmkW=Math.max(...lmk.map(l=>tw(l[0],fsL)));
  const RX=-(wMax+3+lmkW+4),LX=RX+5,RT=Math.ceil(H+heel);
  let ruler=`<rect x="${X(RX)}" y="${Yg(RT)}" width="4" height="${RT}" class="tape"/>`;
  for(let cm=0;cm<=RT;cm++){const big=cm%10===0,m5=cm%5===0;ruler+=`<line x1="${X(RX)}" y1="${Yg(cm)}" x2="${X(RX+(big?2.6:m5?1.8:1))}" y2="${Yg(cm)}" class="tick${big?' b':''}"/>`;
    if(big&&cm>0)ruler+=`<text x="${X(RX-0.8)}" y="${X(Yg(cm)+fsN*0.36)}" class="num" font-size="${X(fsN)}" text-anchor="end">${cm}</text>`}
  lmk.forEach(([n,y])=>{ruler+=`<line x1="${X(RX+4)}" y1="${Yv(y)}" x2="${X(LX+0.6)}" y2="${Yv(y)}" class="lmk"/><text x="${X(LX+1)}" y="${X(Yv(y)+fsL*0.36)}" class="lmk-t" font-size="${X(fsL)}">${n}</text>`});
  let guides='';
  marks.filter(m=>m.guide).forEach(m=>{const gy=Yv(m.y);guides+=`<line x1="${X(RX+4)}" y1="${gy}" x2="${X(-m.xR-1)}" y2="${gy}" class="guide"/><path d="M${X(RX+4)} ${gy} l1.6 -1 v2z" class="gm"/>`});

  /* 오른쪽 설명 */
  const LXr=wMax+5,gap=(fsT+fsS)*1.32,minY=-heel+fsS*0.6;
  const short=s>1.3,shown=marks.filter(m=>!onlyK||m.k===onlyK||m.src===onlyK),labels=(shown.length?shown:marks).map(m=>({...m,name:short?m.name.replace(/ 밑단$/,'').replace(/ 소매 끝$/,' 소매'):m.name,ty:m.y,anchor:m.cuff?m.cuff[1]:[m.xR,m.y]})).sort((a,b2)=>b2.ty-a.ty);
  for(let i=1;i<labels.length;i++)if(labels[i-1].ty-labels[i].ty<gap)labels[i].ty=labels[i-1].ty-gap;
  for(let i=labels.length-1;i>=0;i--){const lim=i===labels.length-1?minY:labels[i+1].ty+gap;if(labels[i].ty<lim)labels[i].ty=lim}
  let notes='',maxTW=0;
  labels.forEach(l=>{const stc=col(l.k),ty=Yv(l.ty);
    const gv=R(l.y+heel),gtxt=l.guide&&gv>0?` · ${gv}cm`:'';
    notes+=`<path d="M${X(l.anchor[0])} ${Yv(l.anchor[1])} L${X(LXr-2.5)} ${ty} L${X(LXr)} ${ty}" class="lead"/><circle cx="${X(l.anchor[0])}" cy="${Yv(l.anchor[1])}" r="${X(0.55*Math.min(s,1.6))}" class="dot"/>`
      +`<rect x="${X(LXr+0.5)}" y="${X(ty-fsT*0.95)}" width="${X(fsT*0.6)}" height="${X(fsT*0.6)}" rx="0.3" fill="${stc}"/>`
      +`<text x="${X(LXr+0.5+fsT*0.85)}" y="${X(ty-fsT*0.28)}" class="nt" font-size="${X(fsT)}">${l.name}</text>`
      +`<text x="${X(LXr+0.5)}" y="${X(ty+fsS*1.05)}" class="ns" font-size="${X(fsS)}">${l.desc}${gtxt}</text>`;
    maxTW=Math.max(maxTW,tw(l.name,fsT)+fsT*0.85,tw(l.desc+gtxt,fsS))});

  /* 굽 */
  let soles='';
  if(heel>0.2){[-1,1].forEach(sd=>{soles+=`<rect x="${X(sd*IB.footX-3.9)}" y="${Yv(0)}" width="7.8" height="${X(heel)}" rx="0.8" class="sole"/>`});
    soles+=`<text x="${X(IB.footX+4.8)}" y="${X(Yg(heel/2)+fsL*0.36)}" class="heelt" font-size="${X(fsL)}">굽 ${heel}cm</text>`}

  const ends=[C.T&&shapes.top&&shapes.top.sleeves.length?C.T.sEnd:null,C.O&&shapes.outer&&shapes.outer.sleeves.length?C.O.sEnd:null].filter(v=>v!==null);
  const armCut=ends.length?Math.min(IB.armY(Math.max(Math.min(...ends)-2,0)),M.armpit-1):M.armpit-1;
  const tys=labels.map(l=>Yv(l.ty)),vbY=Math.min(0,...tys.map(v=>v-fsT*1.3)),vbB=Math.max(TOP+3,...tys.map(v=>v+fsS*1.7));
  const vbX=RX-tw('170',fsN)-2,vbR=LXr+0.5+maxTW+2,vbW=vbR-vbX,vbH=vbB-vbY;
  const svg=`<svg viewBox="${X(vbX)} ${X(vbY)} ${X(vbW)} ${X(vbH)}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="내 치수 마네킹에 옷 실루엣과 밑단 위치를 표시한 그림">
  <defs><radialGradient id="floor"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <clipPath id="armclip"><path d="${path(IB.armPoly(armCut,1))} ${path(IB.armPoly(armCut,-1))}"/></clipPath></defs>
  <ellipse cx="0" cy="${Yg(0)}" rx="${X(hipHalf+2)}" ry="2" fill="url(#floor)"/>
  <line x1="${X(vbX)}" y1="${Yg(0)}" x2="${X(vbR)}" y2="${Yg(0)}" class="floorline"/>
  ${guides}${soles}
  <image href="${IB.url}" x="${IB.X0}" y="${Yv(H+1)}" width="${IB.Wc}" height="${X(H+1)}" preserveAspectRatio="none" class="bodyimg"/>
  ${G.bot}${G.top}${G.outer}
  <image href="${IB.url}" x="${IB.X0}" y="${Yv(H+1)}" width="${IB.Wc}" height="${X(H+1)}" preserveAspectRatio="none" clip-path="url(#armclip)" class="bodyimg"/>
  ${G.topS}${G.outerS}${lines}${ruler}${notes}</svg>`;
  return {svg,w:vbW,h:vbH,sCap:Math.max(1,(H+heel)*0.9/(Math.max(labels.length,1)*(2.8+2.45)*1.32))}}

/* ---------- 결과 ---------- */
function pill(t,c){return `<span class="pill ${c}">${t}</span>`}
function fitChest(e){if(e<0)return pill('작음','bad');if(e<6)return pill('슬림핏','warn');if(e<14)return pill('레귤러핏','ok');if(e<24)return pill('루즈핏','ok');return pill('오버핏','ok')}
function fitShoulder(d){if(d<-1.5)return pill('좁음','bad');if(d<=2)return pill('정어깨','ok');if(d<=6)return pill('살짝 드롭','ok');return pill('드롭숄더','ok')}
function fitEase(e,t){e=R(e);if(e<0)return pill('작음','bad');if(e<t)return pill('딱 맞음','warn');return pill('여유 있음','ok')}
const row=(k,v,s,cls='')=>`<div class="row ${cls}"><span class="k">${k}</span><span class="v">${v}</span>${s?`<span class="s">${s}</span>`:''}</div>`;
function refRows(C,cats,y,label){return C.refs.filter(r=>cats.includes(r.cat)).map(r=>{const d=r.y-y;
  const v=Math.abs(d)<1?`내 ${esc(r.name||'옷')}와 같은 위치`:`내 ${esc(r.name||'옷')}보다 <span class="mono">${R(Math.abs(d))}</span>cm ${d>0?'길어요':'짧아요'}`;
  return row('내 옷 비교',v,`${label} 밑단 기준 · 내 ${esc(r.name||'옷')} ${r.hemTxt}`,'ref')}).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function report(C){const M=C.M,b=state.body;let h='';
  const garment=(T,nm,k,cats)=>{const g=T.g;let x=`<div><h2><i style="background:var(${COLV[k]})"></i>${nm}</h2>`;
    x+=row('밑단',T.hemTxt,`${T.hemY>M.knee?cover(T.hemY)+' · ':''}${C.gtxt(T.hemY)}`);
    if(T.alt)x+=row('B안 밑단',T.alt.hemTxt,`A안보다 <span class="mono">${sg(T.alt.len-g.len)}</span>cm · ${C.gtxt(T.alt.hemY)}`,'alt');
    x+=refRows(C,cats,T.hemY,nm);
    x+=row('소매 끝',T.slTxt,`어깨 끝에서 팔을 따라 <span class="mono">${R(T.sEnd)}</span>cm`);
    if(T.alt&&Math.abs(T.alt.sl-g.sl)>0.4)x+=row('B안 소매',T.alt.slTxt,`A안보다 <span class="mono">${sg(T.alt.sl-g.sl)}</span>cm`,'alt');
    if(k==='outer'&&C.T){const vis=C.O.hemY-C.T.hemY,sv=C.T.sEnd-C.O.sEnd;
      x+=row('이너',vis>0.5?`아우터 밑으로 <span class="mono">${R(vis)}</span>cm 보여요`:'아우터에 다 가려져요',sv>0.5?`이너 소매가 <span class="mono">${R(sv)}</span>cm 나와요`:'이너 소매는 안 보여요')}
    x+=row('핏 (참고)',`어깨 ${fitShoulder(T.shDiff)} 가슴 ${fitChest(T.chEase)}`,`가슴 여유 <span class="mono">${sg(T.chEase)}</span>cm · 솔기가 어깨 끝보다 <span class="mono">${sg(T.shDiff/2)}</span>cm`);
    return x+'</div>'};
  function cover(y){return y>M.pelvis?'엉덩이를 덮지 않음':y<M.fold?'엉덩이를 다 덮음':`엉덩이 약 ${R(clamp((M.pelvis-y)/(M.pelvis-M.fold),0,1)*100)}% 덮음`}
  if(C.T)h+=garment(C.T,'상의','top',['top']);
  if(C.O)h+=garment(C.O,'아우터','outer',['outer']);
  if(C.P){const P=C.P,g=P.g,nm=P.kind==='skirt'?'스커트':'바지';let x=`<div><h2><i style="background:var(--c-bot)"></i>${nm}</h2>`;
    x+=row('밑단',P.hemTxt,`${C.gtxt(P.hemY)}${C.heel&&R(P.hemY+C.heel)>0?` (굽 ${C.heel}cm 포함)`:''}`);
    if(P.alt)x+=row('B안 밑단',P.alt.hemTxt,`A안보다 <span class="mono">${sg(P.alt.len-g.len)}</span>cm · ${C.gtxt(P.alt.hemY)}`,'alt');
    x+=refRows(C,[P.kind],P.hemY,nm);
    const dn=P.yW-M.navel,rise=P.kind==='skirt'?'':(dn>=-1?pill('하이라이즈','ok'):dn>=-6?pill('미드라이즈','ok'):pill('로우라이즈','ok'));
    x+=row('허리 위치',`${P.waistTxt} ${rise}`,`바닥에서 <span class="mono">${R(P.yW+C.heel)}</span>cm`);
    x+=row('핏 (참고)',`허리 ${fitEase(P.wEase,2)}${P.thEase!==undefined?` 허벅지 ${fitEase(P.thEase,4)}`:''}`,`허리 여유 <span class="mono">${sg(P.wEase)}</span>cm${P.thEase!==undefined?` · 허벅지 여유 <span class="mono">${sg(P.thEase)}</span>cm`:''}`);
    h+=x+'</div>'}
  if(!h)h='<p class="note">상의·아우터·하의 탭에서 옷을 고르면 착용 결과가 여기에 나와요.</p>';
  else h+=`<p class="note">무릎·복숭아뼈 같은 기준점은 키·목옆점 높이·가랑이 높이로 계산한 위치예요. 실제 입어 본 옷을 '내 옷' 탭에 넣어 두면 오차를 바로 확인할 수 있어요.</p>`;
  document.getElementById('report').innerHTML=h}

const TABS=[['body','내 체형',null],['top','상의','--c-top'],['outer','아우터','--c-outer'],['bot','하의','--c-bot'],['refs','내 옷','--c-ref']];
function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';
  TABS.forEach(([k,n,cv])=>{const bt=document.createElement('button');bt.type='button';bt.setAttribute('role','tab');bt.id='tab-'+k;bt.setAttribute('aria-selected',state.tab===k);
    bt.innerHTML=(cv?`<span class="dotc" style="background:var(${cv})"></span>`:'')+n;bt.onclick=()=>{state.tab=k;save();renderTabs();renderPane()};t.appendChild(bt)})}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function lab(t){return el(`<div class="label">${t}</div>`)}
function note(t){return el(`<p class="note">${t}</p>`)}
function numField(id,name,hint,val,min,max,onIn,step=0.5){
  const w=el(`<div class="field"><label class="name" for="${id}">${name}</label>
    <div class="num"><button class="step" type="button" aria-label="${name} 줄이기">−</button><input id="${id}" type="number" inputmode="decimal" step="${step}" min="${min}" max="${max}" value="${val}"><span class="u">cm</span><button class="step" type="button" aria-label="${name} 늘리기">+</button></div>
    ${hint?`<div class="hint">${hint}</div>`:''}</div>`);
  const inp=w.querySelector('input'),[dn,up]=w.querySelectorAll('.step');
  const fire=()=>{const v=parseFloat(inp.value);if(!isNaN(v))onIn(clamp(v,min,max))};
  inp.addEventListener('input',fire);
  inp.addEventListener('change',()=>{const v=clamp(num(inp.value,min),min,max);inp.value=v;onIn(v)});
  dn.onclick=()=>{inp.value=clamp(num(inp.value,min)-step,min,max);fire()};
  up.onclick=()=>{inp.value=clamp(num(inp.value,min)+step,min,max);fire()};
  return w}
function chips(opts,cur,onPick){const c=el('<div class="chips"></div>');
  Object.entries(opts).forEach(([k,o])=>{const bt=document.createElement('button');bt.type='button';bt.className='chip';bt.textContent=o.label;bt.setAttribute('aria-pressed',k===cur);bt.onclick=()=>onPick(k);c.appendChild(bt)});return c}
function details(title,nodes){const d=el(`<details><summary>${title}</summary><div class="inner"></div></details>`);nodes.forEach(n=>d.querySelector('.inner').appendChild(n));return d}
function setVal(id,v){const e=document.getElementById(id);if(e&&document.activeElement!==e)e.value=v}

    numField('b-wa','허리둘레','가장 잘록한 곳',B.wa,50,130,v=>{B.wa=v;update()}),
    numField('b-hi','엉덩이둘레','가장 튀어나온 곳',B.hi,70,140,v=>{B.hi=v;update()})]));

  p.appendChild(note('입력값은 이 브라우저에만 저장돼요.'));

function autoNote(){const n=document.getElementById('autonote');if(!n)return;const B=state.body,parts=[];

  else{n.append('직접 잰 값을 쓰고 있어요. ');const bt=el('<button type="button" class="linkbtn">키로 다시 추정</button>');bt.onclick=()=>{B.hpsAuto=B.crotchAuto=true;B.hps=Math.round(B.h*0.82*2)/2;B.crotch=Math.round(B.h*0.456*2)/2;setVal('b-hps',B.hps);setVal('b-crotch',B.crotch);autoNote();update()};n.appendChild(bt)}}

function paneBot(p){const g=state.bot;
  p.appendChild(chips({off:{label:'안 입음'},pants:{label:'바지'},skirt:{label:'스커트'}},g.on?g.kind:'off',k=>{if(k==='off')g.on=false;else{const keepAlt=g.alt;Object.assign(g,{on:true,kind:k},BOT_KIND[k]);g.alt={...keepAlt,len:BOT_KIND[k].len+4}}delete g.label;renderPane();update()}));
  if(!g.on)return;
  p.appendChild(numField('p-len','총장','허리 윗단 → 밑단 (옆선)',g.len,10,140,v=>{g.len=v;update()}));
  if(g.kind==='pants'){
    p.appendChild(numField('p-rise','밑위','가랑이 솔기 → 허리 윗단. 허리 높이가 정해져요.',g.rise,15,45,v=>{g.rise=v;update()}));
    p.appendChild(details('허리·허벅지·밑단 단면 (핏 판정)',[
      numField('p-wa','허리단면','한쪽 면',g.wa,20,70,v=>{g.wa=v;update()}),
      numField('p-th','허벅지단면','가랑이 아래 2cm, 한쪽 면',g.th,15,50,v=>{g.th=v;update()}),
      numField('p-hem','밑단단면','한쪽 면',g.hem,8,45,v=>{g.hem=v;update()})]))}
  else{
    p.appendChild(lab('허리 위치'));
    p.appendChild(chips(SKIRT_AT,g.at||'waist',k=>{g.at=k;renderPane();update()}));
    p.appendChild(details('허리·밑단 단면 (핏 판정)',[
      numField('p-wa','허리단면','한쪽 면',g.wa,20,70,v=>{g.wa=v;update()}),
      numField('p-hem','밑단단면','한쪽 면',g.hem,20,120,v=>{g.hem=v;update()})]))}
  p.appendChild(altBox(g,'p',false))}
const REF_CAT={top:{label:'상의'},outer:{label:'아우터'},pants:{label:'바지'},skirt:{label:'스커트'}};
function paneRefs(p){
  p.appendChild(note('실제로 입어 봐서 기장을 아는 옷을 넣어 두세요. 초록 점선으로 표시되고, 새 옷이 이 옷보다 몇 cm 길고 짧은지 결과에 나와요.'));
  state.refs.forEach((r,i)=>{const card=el('<div class="refcard"></div>');
    const head=el(`<div class="refhead"><label for="r${r.id}-name" class="label" style="flex:none">이름</label><input id="r${r.id}-name" class="txt" type="text" maxlength="14" value="${esc(r.name||'')}" placeholder="예: 검정 코트"><button type="button" class="linkbtn" aria-label="${esc(r.name||'이 옷')} 삭제">삭제</button></div>`);
    head.querySelector('input').addEventListener('input',e=>{r.name=e.target.value;update()});
    head.querySelector('button').onclick=()=>{state.refs.splice(i,1);renderPane();update()};
    card.appendChild(head);
    card.appendChild(chips(REF_CAT,r.cat,k=>{r.cat=k;renderPane();update()}));
    card.appendChild(numField(`r${r.id}-len`,'총장',(r.cat==='top'||r.cat==='outer')?'목옆점 → 밑단':'허리 윗단 → 밑단',r.len,5,220,v=>{r.len=v;update()}));
    if(r.cat==='pants')card.appendChild(numField(`r${r.id}-rise`,'밑위','',num(r.rise,27),15,45,v=>{r.rise=v;update()}));
    if(r.cat==='skirt')card.appendChild(chips(SKIRT_AT,r.at||'waist',k=>{r.at=k;renderPane();update()}));
    p.appendChild(card)});
  if(state.refs.length<5){const ad=el('<button type="button" class="addbtn">+ 내 옷 추가</button>');
    ad.onclick=()=>{state.refs.push({id:Date.now()%1e7,name:'',cat:'outer',len:95,rise:27,at:'waist'});renderPane();update();setTimeout(()=>{const ins=document.querySelectorAll('.refcard .txt');ins.length&&ins[ins.length-1].focus()},0)};p.appendChild(ad)}}
function renderPane(){const p=document.getElementById('pane');p.innerHTML='';p.setAttribute('aria-labelledby','tab-'+state.tab);
  ({body:paneBody,top:paneTop,outer:paneOuter,bot:paneBot,refs:paneRefs}[state.tab]||paneBody)(p)}

/* ---------- 그리기 · 갱신 ---------- */
const figEl=document.getElementById('fig'),stageEl=document.getElementById('stage'),sizeBtn=document.getElementById('sizebtn');
const bodyImg=new Image();let imgReady=false,IBkey='',IB=null,lastC=null;
bodyImg.onload=()=>{imgReady=true;draw()};bodyImg.src=IMG_SRC;
function legend(C){const it=[];if(C.T)it.push(['상의','--c-top','']);if(C.O)it.push(['아우터','--c-outer','']);if(C.P)it.push([C.P.kind==='skirt'?'스커트':'바지','--c-bot','']);
  if((C.T&&C.T.alt)||(C.O&&C.O.alt)||(C.P&&C.P.alt))it.push(['B안','--c-alt','d']);if(C.refs.length)it.push(['내 옷','--c-ref','d']);
  document.getElementById('legend').innerHTML=it.map(([n,v,d])=>`<span style="color:var(${v})"><i class="${d}"></i><b style="color:var(--muted);font-weight:500">${n}</b></span>`).join('')}
function draw(){if(!lastC||!imgReady)return;
  const bk=JSON.stringify({...state.body,heel:0});if(bk!==IBkey){IB=makeImgBody(state.body,bodyImg);IBkey=bk}
  const w=figEl.clientWidth-12,h=figEl.clientHeight-10;if(w<60||h<60)return;
  const onlyK=stageEl.classList.contains('typing')?({top:'top',outer:'outer',bot:'bot',refs:'ref'}[state.tab]||null):null;
  let s=1,out=drawIllo(state,lastC,IB,s,onlyK);
  for(let i=0;i<3;i++){const ppu=Math.min(w/out.w,h/out.h),ns=clamp(Math.min(12/(2.8*ppu),out.sCap),1,4);if(Math.abs(ns-s)<0.04)break;s=ns;out=drawIllo(state,lastC,IB,s,onlyK)}
  figEl.innerHTML=out.svg}
let raf=0;
function update(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{save();lastC=compute();report(lastC);legend(lastC);draw()})}
function setBig(v){state.big=v;stageEl.classList.toggle('big',v);sizeBtn.textContent=v?'그림 작게':'그림 크게';sizeBtn.setAttribute('aria-pressed',v)}
sizeBtn.onclick=()=>{setBig(!state.big);save();requestAnimationFrame(draw)};
const ctrlEl=document.querySelector('.ctrl'),narrow=()=>innerWidth<860;
ctrlEl.addEventListener('focusin',e=>{if(narrow()&&e.target.matches('input'))stageEl.classList.add('typing')});
ctrlEl.addEventListener('focusout',()=>setTimeout(()=>{if(!ctrlEl.contains(document.activeElement)||!document.activeElement.matches('input'))stageEl.classList.remove('typing')},60));
new ResizeObserver(()=>draw()).observe(figEl);
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw())}catch(e){}
setBig(!!state.big);renderTabs();renderPane();update();
})();
</script>
