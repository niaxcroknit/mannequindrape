# main에 올릴 때마다 앱이 문제없이 빌드되는지 확인하고, 휴대폰 설치용 .apk를 만들어요.
# 스토어용 .aab는 안드로이드 스튜디오에서 내 업로드 키로 만들어요 (등록안내.md 1부).
# 결과 파일: Actions 탭 → 맨 위 실행 → 아래쪽 Artifacts
name: 앱 빌드 확인

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 웹 버전(docs/index.html)이 앱 화면과 같은지 확인
        run: cmp app/src/main/assets/index.html docs/index.html || { echo "docs/index.html을 app/src/main/assets/index.html과 똑같이 맞춰 주세요"; exit 1; }

      # 빌드 서버(ubuntu-latest)에는 안드로이드 SDK가 이미 깔려 있어요 (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (설치용 apk + 스토어용 빌드가 되는지 확인)
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: 휴대폰-설치용-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
