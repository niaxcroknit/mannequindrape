# main에 올릴 때마다 앱을 빌드해서, 플레이 스토어에 올릴 .aab와 휴대폰 설치용 .apk를 만들어요.
# 결과 파일: Actions 탭 → 맨 위 실행 → 아래쪽 Artifacts
name: 앱 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 빌드 서버(ubuntu-latest)에는 안드로이드 SDK가 이미 깔려 있어요 (ANDROID_HOME)
      - name: 업로드 키 준비 (저장소 비밀값이 있을 때만)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "서명된 빌드를 만들어요"
          else
            echo "비밀값이 없어서 서명 없는 빌드를 만들어요"
          fi

      - name: 빌드
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: 플레이스토어-업로드용-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: 휴대폰-설치용-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
